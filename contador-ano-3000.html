<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador até o ano 3000 — Horário de Brasília</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .container {
    text-align: center;
    max-width: 600px;
    width: 100%;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    color: #94a3b8;
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 2rem;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 1.2rem 0.5rem;
  }
  .number {
    font-size: 2rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 0.8rem;
    color: #94a3b8;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .now-box {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 1rem;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .now-label {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .now-time {
    font-size: 1.4rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .years {
    margin-top: 1.5rem;
    color: #64748b;
    font-size: 0.85rem;
  }
  footer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 0.8rem;
    color: #64748b;
  }
  footer a {
    color: #94a3b8;
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
  .insta-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 8px 16px;
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    color: #fff !important;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none !important;
  }
  .insta-btn:hover {
    opacity: 0.9;
    text-decoration: none !important;
  }
  .insta-btn svg {
    width: 16px;
    height: 16px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .number { font-size: 1.6rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Faltam para 1º de janeiro de 3000</h1>
    <p class="subtitle">Contagem baseada no horário de Brasília (UTC-3)</p>

    <div class="grid">
      <div class="card">
        <div class="number" id="days">0</div>
        <div class="label">Dias</div>
      </div>
      <div class="card">
        <div class="number" id="hours">0</div>
        <div class="label">Horas</div>
      </div>
      <div class="card">
        <div class="number" id="mins">0</div>
        <div class="label">Minutos</div>
      </div>
      <div class="card">
        <div class="number" id="secs">0</div>
        <div class="label">Segundos</div>
      </div>
    </div>

    <div class="now-box">
      <div class="now-label">Agora em Brasília</div>
      <div class="now-time" id="now-time">--:--:--</div>
    </div>

    <p class="years" id="years-out"></p>

    <footer>
      Powered by: FTG, DEV MARCOS
      <br>
      <a class="insta-btn" href="https://www.instagram.com/marcos_santiago1234?stkn=bXJnaHg5dmJ6aTJi" target="_blank" rel="noopener noreferrer">

        </svg>
        Instagram
      </a>
    </footer>
  </div>

<script>
  // Ano 3000, 1 de janeiro, 00:00 no horário de Brasília (UTC-3, sem horário de verão)
  const targetUTC = Date.UTC(3000, 0, 1, 3, 0, 0); // 00:00 BRT = 03:00 UTC

  function pad(n) { return String(n).padStart(2, '0'); }

  function update() {
    const nowUTC = Date.now();
    let diff = targetUTC - nowUTC;
    if (diff < 0) diff = 0;

    const secTotal = Math.floor(diff / 1000);
    const days = Math.floor(secTotal / 86400);
    const hours = Math.floor((secTotal % 86400) / 3600);
    const mins = Math.floor((secTotal % 3600) / 60);
    const secs = secTotal % 60;

    document.getElementById('days').textContent = days.toLocaleString('pt-BR');
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('mins').textContent = pad(mins);
    document.getElementById('secs').textContent = pad(secs);

    const years = (days / 365.25).toFixed(1);
    document.getElementById('years-out').textContent = `aproximadamente ${years} anos`;

    // Horário atual de Brasília
    const brasiliaNow = new Date().toLocaleTimeString('pt-BR', {
      timeZone: 'America/Sao_Paulo',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    document.getElementById('now-time').textContent = brasiliaNow;
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
